# ==============================================================================
# Pytest Test Collection Policy (Phase P12.1 Governance)
# ==============================================================================
# This configuration governs default test collection for the current certified
# repository state.
#
# Retired historical guard test suites:
# - tests/test_final_evaluation_guard.py (Phase 11 v1 historical guard)
# - tests/test_final_evaluation_guard_v2.py (Phase 11 v2 historical guard)
# - tests/test_post_holdout_evaluation_v2.py (Phase 11 v2 historical pipeline test)
#
# These 18 test items target obsolete freeze manifests (v1, v2) and assert
# historical source hashes prior to later research-phase refactoring.
# They are classified as RETIRED_HISTORICAL_GUARD_SUITE in:
# artifacts/audit/retired_guard_scope_manifest.json
#
# To execute the retired historical guard suite explicitly:
# pytest tests/test_final_evaluation_guard.py tests/test_final_evaluation_guard_v2.py tests/test_post_holdout_evaluation_v2.py
# ==============================================================================

[pytest]
testpaths = tests
addopts = 
    --ignore=tests/test_final_evaluation_guard.py
    --ignore=tests/test_final_evaluation_guard_v2.py
    --ignore=tests/test_post_holdout_evaluation_v2.py
