    governing_roadmap: "01_Roadmap_12_tuan_Aeolus_Gate_Optimization_V4_DONG_BO.md"
    core_methods_count: 5
    manifest_path: "artifacts/manifests/model_registry_manifest_v2.json"
    status: "CURRENT_ACTIVE"

