project:
  name: aeolus-gate-optimization
  version: 0.1.0

data:
  years: "2016-2024"
  hub: ATL
  raw_tabular_path: data/raw/tabular
  raw_chain_path: data/raw/chain
  processed_path: data/processed

prediction:
  cutoff_hours_before_crs_dep: 2

  arrival_core:
    role: core
    flow: inbound
    filter: DEST=ATL
    classification:
      target: ARR_DELAY
      label_name: y_arr_cls
      threshold_minutes: 15
    regression:
      enabled: true
      target: ARR_DELAY
      label_name: y_arr_reg
      signed: true
    weather:
      allowed: false
      aeolus_raw_policy: drop
    reconstructed_chain:
      artifact_version: schedule_chain_v1
      allowed_for_ablation: true
      enabled_by_default: false

  departure_auxiliary:
    role: auxiliary
    flow: outbound
    filter: ORIGIN=ATL
    classification:
      target: DEP_DELAY
      label_name: y_dep_cls
      threshold_minutes: 15
    regression:
      enabled: false
    weather:
      aeolus_raw_policy: drop
      point_in_time_source:
        artifact_version: weather_point_in_time_v1
        contract_version: weather_point_in_time_contract_v1
        contract_path: artifacts/manifests/weather_point_in_time_contract_v1.json
        provider: TBD
        status: audit_required
        enabled: false
        row_parity_required: true

temporal:
  development_years: "2016-2022"
  model_selection_year: 2023
  final_holdout_year: 2024
  rolling_folds:
    implementation_decision: expanding_window_v1
    folds:
      - id: fold_1
        train_years: [2016, 2017, 2018]
        validation_year: 2019
      - id: fold_2
        train_years: [2016, 2017, 2018, 2019]
        validation_year: 2020
      - id: fold_3
        train_years: [2016, 2017, 2018, 2019, 2020]
        validation_year: 2021
      - id: fold_4
        train_years: [2016, 2017, 2018, 2019, 2020, 2021]
        validation_year: 2022

flows:
  inbound:
    filter: DEST=ATL
    role: core_arrival_ml
  outbound:
    filter: ORIGIN=ATL
    role:
      - auxiliary_departure_ml
      - synthetic_turn_simulation

flight_chain:
  raw:
    status: final_no_go
    enabled_by_default: false
    include_in_core: false
    ablation: false
  reconstructed:
    version: schedule_chain_v1
    datetime_storage_amendment_version: canonical_datetime_storage_amendment_v1
    status: go_for_ablation
    enabled_by_default: false
    include_in_core: false
    ablation: true
    ablation_week: 6
    source: canonical_tabular
    output_path: data/processed/flight_chain_reconstructed_v1
    physical_aircraft_identity: false
    group_fields:
      - source_year
      - FL_DATE
      - OP_CARRIER
      - OP_CARRIER_FL_NUM
    order_field: CRS_DEP_TIME
    tie_break_fields:
      - ORIGIN
      - DEST
      - flight_key
    max_context_length: 6
    feature_engineering:
      policy_version: reconstructed_chain_feature_availability_v1
      policy_path: configs/reconstructed_chain_feature_policy.yaml
      audit_status: completed
      audit_result_version: reconstructed_chain_feature_availability_audit_v1
      audit_result_path: artifacts/manifests/reconstructed_chain_feature_availability_audit_v1.json
      ml_enabled: false
      arr_b_enabled: false
      keep_safe_feature_count: 0
      diagnostic_materialization_allowed: true
      diagnostic_materialization_executed: false
      ml_materialization_allowed: false
      ml_branch_status: blocked_pending_new_evidence
      closure_status: completed_with_blocked_ml_branch
      availability_gate_required: true

models:
  core_methods:
    - linear
    - random_forest
    - hist_gradient_boosting
    - xgboost
    - weighted_ensemble

simulation:
  prediction_source_task: arrival_core
  auxiliary_departure_prediction_allowed: false
  synthetic_aircraft_only: true
  default_contact_gates: 30
  scenario_scales:
    - 100
    - 200
    - 300

reproducibility:
  project_seed: 202601
  seed_status: implementation_default_not_scientific_claim
