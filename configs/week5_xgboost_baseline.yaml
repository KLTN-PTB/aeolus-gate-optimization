baseline_version: arrival_xgboost_baseline_v1
experiment_contract_version: arrival_week5_xgboost_experiment_v1
task: arrival_core
method_id: xgboost
feature_manifest_version: feature_manifest_arrival_v1
preprocessing_version: arrival_preprocessing_v1

classification:
  estimator: XGBClassifier
  objective: binary:logistic
  eval_metric: logloss
  n_estimators: 128
  learning_rate: 0.05
  max_depth: 6
  min_child_weight: 20.0
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0.0
  reg_lambda: 2.0
  tree_method: hist
  device: cpu
  max_bin: 256
  n_jobs: 1
  early_stopping: false
  random_state_source: configs/base.yaml:reproducibility.project_seed
  class_imbalance_policy: scale_pos_weight_from_training_fold_only

regression:
  estimator: XGBRegressor
  objective: reg:squarederror
  eval_metric: rmse
  n_estimators: 128
  learning_rate: 0.05
  max_depth: 6
  min_child_weight: 20.0
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0.0
  reg_lambda: 2.0
  tree_method: hist
  device: cpu
  max_bin: 256
  n_jobs: 1
  early_stopping: false
  random_state_source: configs/base.yaml:reproducibility.project_seed

resource_policy:
  target_memory_gib: 16
  execution_parallelism: 1
  production_training_rows: full_eligible_fold_rows
  production_sampling_allowed: false
  gpu_allowed: false
  early_stopping_policy: disabled_no_locked_validation_control
  rationale: >-
    Fixed CPU-safe baseline pre-registered before production validation metrics:
    histogram trees, bounded depth and estimators, conservative row/column sampling,
    regularization, single-process execution, and no validation-driven early stopping.

threshold_policy:
  fixed_probability_threshold: 0.5
  validation_optimization_allowed: false

hpo:
  allowed: false
