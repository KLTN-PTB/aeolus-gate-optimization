# Pre-registered Model Selection Policy for 2023 Development Set (Phase 7)
# Governed by V4 Synchronized Protocol and Fail-Closed Architecture

selection_policy_version: "academic_model_selection_v1"
created_at_utc: "2026-09-30T21:30:00Z"
status: "LOCKED_PRE_REGISTERED"

temporal_scope:
  training_years: [2016, 2017, 2018, 2019, 2020, 2021, 2022]
  evaluation_year: 2023
  evaluation_role: "development_model_selection"
  holdout_year: 2024
  holdout_policy: "FAIL_CLOSED_SEALED"

task:
  name: "Core Arrival"
  filter: "DEST=ATL"
  cutoff: "CRS_DEP_TIME - 2h"
  feature_set: "v1"
  features_allowed: 11
  weather_allowed: false
  flight_chain_allowed: false

sample_sizes:
  sample_train_per_year: 3500
  sample_val: 4000
  random_seed: 202601

candidate_pool:
  point_models:
    - "arrival_linear_baseline_v1"
    - "arrival_random_forest_baseline_v1"
    - "arrival_hist_gradient_boosting_baseline_v1"
    - "arrival_xgboost_baseline_v1"
    - "arrival_weighted_ensemble_v1"
  probabilistic_models:
    - "P1_empirical"
    - "P2_xgb_gaussian_oof"
    - "P3_ngboost_normal"
    - "P4_ngboost_student_t"
    - "P5_quantile_regression"

selection_rules:
  point_regression:
    primary_metric: "mae"
    direction: "minimize"
    secondary_metrics: ["rmse", "r2", "severe_delay_mae"]
    effect_size_delta: 0.10  # minutes (6 seconds)
  point_classification:
    primary_metric: "pr_auc"
    direction: "maximize"
    secondary_metrics: ["roc_auc", "brier_score", "log_loss"]
    effect_size_delta: 0.0050
  probabilistic:
    primary_metric: "crps"
    direction: "minimize"
    secondary_metrics: ["nll", "brier_score_delay_ge_15", "mean_pinball_loss", "cov_80", "cov_90"]
    effect_size_delta: 0.10  # minutes (6 seconds, consistent with FORECAST_EFFECT_SIZE_DELTA)

operational_gates:
  stability_required: true
  max_allowed_cv: 0.05
  numerical_failure_allowed: false
  max_runtime_seconds: 60.0

tie_break_policy:
  rule: "effect_size_indifference_band"
  behavior: "report_tie_when_within_delta"
  force_single_selection: false
  description: "If candidate metrics are within effect_size_delta of the best candidate, declare a tie / indeterminate. Do not force an arbitrary choice based on decimal noise."
